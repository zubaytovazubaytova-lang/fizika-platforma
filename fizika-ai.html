<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fizika AI — Fizikani yangicha his qiling</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: radial-gradient(ellipse at 20% 50%, #0d1b3e 0%, #0a0f1e 50%, #0d0a1f 100%);
      color: #e2e8f0;
    }

    /* Stars background */
    .stars {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.1; transform: scale(0.8); }
      to   { opacity: 0.9; transform: scale(1.2); }
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #fff;
    }
    .logo-text {
      font-size: 18px; font-weight: 800; color: #f8fafc;
    }
    .logo-text span { color: #a855f7; }

    /* ===== SLIDES ===== */
    .slides-wrap {
      position: relative; z-index: 10;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0;
      transform: translateX(60px);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .slide.active {
      opacity: 1; transform: translateX(0);
      pointer-events: all;
    }
    .slide.prev {
      opacity: 0; transform: translateX(-60px);
    }

    /* Slide 1 — Welcome */
    .badge-welcome {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: 20px; padding: 6px 18px;
      font-size: 12px; font-weight: 700; color: #f59e0b;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    .badge-welcome::before, .badge-welcome::after {
      content: '——'; opacity: 0.5; font-size: 10px;
    }
    .slide-title-main {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 900; color: #f59e0b;
      text-align: center; line-height: 1.1;
      margin-bottom: 16px;
    }
    .slide-subtitle {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900; color: #f8fafc;
      text-align: center; line-height: 1.1;
    }

    /* Slide 2 — Quote */
    .quote-text {
      font-size: clamp(16px, 2.5vw, 22px);
      font-style: italic; color: #94a3b8;
      text-align: center; max-width: 540px;
      line-height: 1.6;
    }
    .quote-text::before { content: '"'; }
    .quote-text::after { content: '"'; }

    /* Slide 3 — Atom */
    .atom-wrap {
      position: relative;
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
    }
    .nucleus {
      width: 48px; height: 48px;
      background: radial-gradient(circle, #fbbf24, #f59e0b);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(245,158,11,0.6), 0 0 60px rgba(245,158,11,0.3);
      z-index: 2;
    }
    .orbit {
      position: absolute;
      border-radius: 50%;
      border: 2px solid;
    }
    .orbit-1 {
      width: 130px; height: 70px;
      border-color: rgba(168,85,247,0.7);
      transform: rotate(0deg);
      animation: orbit-spin 2.5s linear infinite;
    }
    .orbit-2 {
      width: 160px; height: 80px;
      border-color: rgba(59,130,246,0.6);
      transform: rotate(60deg);
      animation: orbit-spin 3.2s linear infinite reverse;
    }
    .orbit-3 {
      width: 190px; height: 95px;
      border-color: rgba(245,158,11,0.5);
      transform: rotate(120deg);
      animation: orbit-spin 4s linear infinite;
    }
    .electron {
      position: absolute;
      width: 12px; height: 12px;
      border-radius: 50%;
    }
    @keyframes orbit-spin {
      from { transform: rotate(var(--start, 0deg)); }
      to   { transform: rotate(calc(var(--start, 0deg) + 360deg)); }
    }
    /* electrons are placed on the orbits */
    .e1 { top: -6px; left: calc(50% - 6px); background: #a855f7; box-shadow: 0 0 8px #a855f7; }
    .e2 { top: -6px; left: calc(50% - 6px); background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
    .e3 { top: -6px; left: calc(50% - 6px); background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    /* Slide 4 — CTA */
    .scroll-hint {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .scroll-label {
      font-size: 12px; font-weight: 700; color: #f59e0b;
      letter-spacing: 3px;
    }
    .wave-svg {
      animation: wave-float 1.5s ease-in-out infinite alternate;
    }
    @keyframes wave-float {
      from { transform: translateY(0); }
      to   { transform: translateY(6px); }
    }

    /* ===== DOTS ===== */
    .dots {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 100;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.3s;
    }
    .dot.active {
      width: 28px;
      background: #f59e0b;
    }

    /* ===== NEXT BUTTON ===== */
    .btn-next {
      position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
      z-index: 100;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: #f8fafc; font-size: 18px;
    }
    .btn-next:hover { background: rgba(245,158,11,0.3); border-color: #f59e0b; }

    .btn-back {
      position: fixed; left: 28px; top: 50%; transform: translateY(-50%);
      z-index: 100;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: #64748b; font-size: 18px;
    }
    .btn-back:hover { background: rgba(255,255,255,0.12); color: #f8fafc; }
    .btn-back.hidden { display: none; }

    /* ===== ENTER BUTTON (last slide) ===== */
    .btn-enter {
      margin-top: 40px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none; border-radius: 14px;
      color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(139,92,246,0.4);
      transition: all 0.25s;
      display: flex; align-items: center; gap: 10px;
    }
    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(139,92,246,0.5);
    }

    /* Atom icon in top-right nav */
    .nav-atom {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #f59e0b22, #f97316
22);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }

    /* Features grid on last slide */
    .features {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: center; margin-top: 28px; max-width: 560px;
    }
    .feat {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 8px 16px;
      font-size: 13px; font-weight: 500; color: #cbd5e1;
    }
  </style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Top Nav -->
<nav class="top-nav">
  <div class="logo">
    <div class="logo-icon">⚛</div>
    <span class="logo-text">Fizika <span>AI</span></span>
  </div>
  <div class="nav-atom">⚛️</div>
</nav>

<!-- Slides -->
<div class="slides-wrap">

  <!-- Slide 0 — Xush kelibsiz -->
  <div class="slide active" id="slide-0">
    <div class="badge-welcome">XUSH KELIBSIZ</div>
    <div class="slide-title-main">Assalomu Alaykum! 👋</div>
    <div class="slide-subtitle">Fizikani yangicha his qiling</div>
  </div>

  <!-- Slide 1 — Quote -->
  <div class="slide" id="slide-1">
    <div class="quote-text">Har bir savol — yangi kashfiyotning boshlanishi</div>
  </div>

  <!-- Slide 2 — Atom animation -->
  <div class="slide" id="slide-2">
    <div class="atom-wrap">
      <div class="nucleus"></div>
      <div class="orbit orbit-1" style="--start:0deg;">
        <div class="electron e1"></div>
      </div>
      <div class="orbit orbit-2" style="--start:60deg;">
        <div class="electron e2"></div>
      </div>
      <div class="orbit orbit-3" style="--start:120deg;">
        <div class="electron e3"></div>
      </div>
    </div>
  </div>

  <!-- Slide 3 — Oldinga suring / CTA -->
  <div class="slide" id="slide-3">
    <div class="scroll-hint">
      <div class="scroll-label">OLDINGA SURING</div>
      <svg class="wave-svg" width="48" height="20" viewBox="0 0 48 20" fill="none">
        <path d="M2 10 Q8 2 14 10 Q20 18 26 10 Q32 2 38 10 Q44 18 46 14" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  </div>

  <!-- Slide 4 — Kirish -->
  <div class="slide" id="slide-4">
    <div style="text-align:center;">
      <div style="font-size:clamp(28px,5vw,48px);font-weight:900;color:#f8fafc;margin-bottom:12px;">Tayyor! 🚀</div>
      <div style="font-size:16px;color:#94a3b8;max-width:480px;margin:0 auto;">
        Sun'iy intellekt yordamida fizika masalalarini yechish, simulatsiyalar va testlar
      </div>
      <div class="features">
        <div class="feat">🤖 AI Tutor</div>
        <div class="feat">⚗️ Simulyator</div>
        <div class="feat">📝 Testlar</div>
        <div class="feat">📚 Darsliklar</div>
      </div>
      <button class="btn-enter" onclick="window.location.href='index.html'">
        Platformaga kirish →
      </button>
    </div>
  </div>

</div>

<!-- Nav buttons -->
<button class="btn-back hidden" id="btn-back" onclick="changeSlide(-1)">‹</button>
<button class="btn-next" id="btn-next" onclick="changeSlide(1)">›</button>

<!-- Dots -->
<div class="dots" id="dots"></div>

<script>
  // Generate stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      animation-delay:${(Math.random()*4).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  // Slides logic
  const TOTAL = 5;
  let current = 0;

  const dotsEl = document.getElementById('dots');
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsEl.appendChild(d);
  }

  function goTo(n) {
    const prev = document.getElementById('slide-' + current);
    prev.classList.remove('active');
    prev.classList.add('prev');
    setTimeout(() => prev.classList.remove('prev'), 600);

    current = n;
    document.getElementById('slide-' + current).classList.add('active');

    // dots
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === current);
    });

    // buttons
    document.getElementById('btn-back').classList.toggle('hidden', current === 0);
    document.getElementById('btn-next').style.display = current === TOTAL - 1 ? 'none' : 'flex';
  }

  function changeSlide(dir) {
    const next = Math.min(Math.max(0, current + dir), TOTAL - 1);
    if (next !== current) goTo(next);
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changeSlide(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   changeSlide(-1);
  });

  // Touch swipe
  let touchX = 0;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    const dx = touchX - e.changedTouches[0].clientX;
    if (Math.abs(dx) > 50) changeSlide(dx > 0 ? 1 : -1);
  });
</script>
</body>
</html>
