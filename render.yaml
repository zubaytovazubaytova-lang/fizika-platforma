services:
  - type: web
    name: fizika-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi --workers 1 --threads 2 --worker-class gthread --max-requests 500 --log-file - --bind 0.0.0.0:$PORT
    plan: free
    disk:
      name: fizika-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:////data/db.sqlite3
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://fizika-platforma.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
