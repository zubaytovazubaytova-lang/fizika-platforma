<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ lesson.title }}</title>
</head>
<body>
    <h1>{{ lesson.title }}</h1>
    <p>{{ lesson.content }}</p>

    {% if progress.completed %}
        <p>Bu dars tugallangan.</p>
    {% else %}
        <form method="post" action="{% url 'courses:lesson_done' lesson.pk %}">
            {% csrf_token %}
            <button type="submit">Darsni tugatish</button>
        </form>
    {% endif %}
</body>
</html>
